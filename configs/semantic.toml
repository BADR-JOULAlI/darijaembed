seed = 42
output_dir = "../runs/semantic"

[model]
name = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
max_seq_length = 128
device = "auto"

# Gated dataset: accept the source conditions on Hugging Face first.
[dataset]
path = "BounharAbdelaziz/Sentence-Transformers-Morocco-Darija"
split = "train"
format = "huggingface"
max_samples = 30000
role = "train"
[dataset.columns]
anchor = "anchor"
positive = "positive"
negative = "negative"

[training]
batch_size = 16
gradient_accumulation_steps = 2
learning_rate = 2e-5
max_steps = 1000
warmup_steps = 100
precision = "auto"
validation_fraction = 0.1
logging_steps = 10
eval_steps = 100
gradient_checkpointing = true

[evaluation]
batch_size = 32
score_min = 0.0
score_max = 1.0
[evaluation.dataset]
path = "atlasia/Morocco-Darija-Sentence-Embedding-Benchmark"
split = "test"
format = "huggingface"
role = "test"
[evaluation.dataset.columns]
sentence1 = "sentence1"
sentence2 = "sentence2"
score = "score"
